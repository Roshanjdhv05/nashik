<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0277BD"/>
      <stop offset="50%" stop-color="#01579B"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
  </defs>

  <!-- Outer Golden Ring Arc -->
  <path d="M 120 70 A 210 210 0 1 1 470 320" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Background Sun Disk -->
  <circle cx="280" cy="220" r="100" fill="url(#sunGrad)" opacity="0.95"/>
  <circle cx="280" cy="220" r="130" fill="#FFE082" opacity="0.3"/>

  <!-- River Waves Base Circle Fill -->
  <clipPath id="circleClip">
    <circle cx="256" cy="256" r="236"/>
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Main Temple Silhouette -->
    <!-- Base platform -->
    <rect x="90" y="270" width="180" height="40" fill="#8D6E63"/>
    <!-- Temple Pillars -->
    <rect x="110" y="230" width="16" height="40" fill="#D84315"/>
    <rect x="145" y="230" width="16" height="40" fill="#D84315"/>
    <rect x="180" y="230" width="16" height="40" fill="#D84315"/>
    <rect x="215" y="230" width="16" height="40" fill="#D84315"/>
    <!-- Temple Mandap Roof -->
    <polygon points="95,230 265,230 240,210 120,210" fill="#E64A19"/>
    <!-- Shikhar (Spire) Layers -->
    <polygon points="130,210 230,210 215,170 145,170" fill="url(#templeGrad)"/>
    <polygon points="140,170 205,170 195,130 150,130" fill="url(#templeGrad)"/>
    <polygon points="148,130 197,130 190,95 155,95" fill="url(#templeGrad)"/>
    <polygon points="155,95 190,95 177,65 168,65" fill="url(#templeGrad)"/>
    <!-- Kalash & Flag -->
    <circle cx="172.5" cy="58" r="7" fill="#FFD54F"/>
    <path d="M 172.5 52 L 172.5 25 L 210 38 L 172.5 50 Z" fill="#FF3D00"/>

    <!-- Secondary Spire (Back Temple) -->
    <polygon points="245,260 295,260 288,210 252,210" fill="#78909C"/>
    <polygon points="250,210 290,210 282,170 258,170" fill="#607D8B"/>
    <polygon points="256,170 284,170 276,140 264,140" fill="#455A64"/>
    <path d="M 270 140 L 270 115 L 295 125 Z" fill="#FF5722"/>

    <!-- Sacred River Godavari Waves (Foreground Wave Layer) -->
    <path d="M 20 310 Q 150 260 280 320 T 500 300 L 520 520 L -10 520 Z" fill="url(#riverGrad)"/>
    <path d="M -10 350 Q 140 300 270 360 T 520 340 L 520 520 L -10 520 Z" fill="#01579B" opacity="0.8"/>
    <!-- Wave Crest Highlight -->
    <path d="M 40 312 Q 150 265 280 322 T 490 304" fill="none" stroke="#E0F7FA" stroke-width="6" stroke-linecap="round"/>
    <path d="M 90 355 Q 200 310 330 365" fill="none" stroke="#B2EBF2" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
